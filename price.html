  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 상단 메뉴 -->

  <section class="tight">

      <div class="price-list">

        <div class="item">
          <div>

    </div>

  <div class="mobile-bar">
    <a href="tel:" class="call">전화 예약</a>
    <a href="#" class="kakao">카카오톡 문의</a>
